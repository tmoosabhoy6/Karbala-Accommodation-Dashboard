<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1013" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/key.svg" />
    <title>Karbala Rooms</title>
    <script>
      try {
        var t = localStorage.getItem("krb-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
